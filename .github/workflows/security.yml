name: Phase 1 security verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [portfolio-v2-phase-01-security]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify no new lint failures (three documented baseline errors remain)
        run: npm run lint:phase1
      - run: npm run build
      - run: npm run check:client-secrets
      - run: npm audit --audit-level=moderate
